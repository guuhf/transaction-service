spring:
  application:
    name: transaction-service

  datasource:
    url: jdbc:postgresql://localhost:5432/db_transactions
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

server:
  port: 8081